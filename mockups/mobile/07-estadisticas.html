<style>

    --bar: rgba(246, 243, 236, .92); --stripe: rgba(42, 37, 33, .032);

    --accent: #D98A66; --accent-2: #EBA383; --ok: #7FB49B; --star: #5C5245;

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-2); text-decoration: underline; }
  ::selection { background: var(--selection); }

  body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 56px 24px 80px; }
</style>
